<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Microphone Permission</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      text-align: center; 
      padding: 50px; 
      background: #111; 
      color: #e5e5e5; 
      margin: 0;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }
    h2 { margin-top: 0; color: #ff6b00; }
    p { color: #aaa; line-height: 1.5; margin-bottom: 24px; }
    button { 
      padding: 12px 24px; 
      font-size: 15px; 
      cursor: pointer; 
      background: #ff6b00; 
      color: #fff; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #e56000; }
    #status { margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Microphone Access</h2>
    <p>The Ollama Browser Agent needs microphone access so you can use voice input.</p>
    <button id="allowBtn">Grant Permission</button>
    <div id="status"></div>
  </div>
  <script src="mic-permission.js"></script>
</body>
</html>
